# What the pipeline of kxml does. Every key overrides a default of
# actions/plan/defaults.yml in davils-com/kotlin-workflow; a key that is not there stops the run.
version: 1
gradle:
  args: ["--stacktrace"]

check:
  tasks: [check]
  reproducible:
    clean-tasks: [":kxml-core:clean", ":kxml-serialization:clean"]
    tasks: [":kxml-core:jar", ":kxml-serialization:jar"]
    artifacts: ["kxml-core/build/libs/*.jar", "kxml-serialization/build/libs/*.jar"]

policy:
  push-develop:
    stages: [check, snapshot]
    overrides:
      check:
        reproducible: { enabled: true }
  push-main:
    overrides:
      check:
        reproducible: { enabled: true }

security:
  gradle:
    tasks: ["kreateAssurance"]
  dependency-submission:
    enabled: false

publish:
  build-tasks: [assemble]
  tasks:
    - ":kxml-core:publishAllPublicationsToDavilsRepository"
    - ":kxml-serialization:publishAllPublicationsToDavilsRepository"

snapshot:
  # kxml's own build makes every build without a release tag a snapshot.
  kreate-snapshot: false

release:
  publications:
    discovery: explicit
    list:
      - path: com/davils/kxml-core
        artifact: kxml-core
        task: ":kxml-core:publishMavenPublicationToDavilsRepository"
      - path: com/davils/kxml-serialization
        artifact: kxml-serialization
        task: ":kxml-serialization:publishMavenPublicationToDavilsRepository"
  attest:
    subjects:
      - "kxml-core/build/libs/*.jar"
      - "kxml-serialization/build/libs/*.jar"
  github-release:
    enabled: false

# How a pull request of Dependabot repairs itself, see CONTRIBUTING.md, "Changing a Dependency".
dependencies:
  lock:
    invocations:
      - ["kreateResolveAndLockAll", "--write-locks", "--no-configuration-cache"]
  verification:
    tasks: [check]
