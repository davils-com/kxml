name: Bug report
description: Something in kxml does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never report a security problem here. Use the private vulnerability reporting instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest Kotlin snippet or test that shows the problem.
      render: kotlin
    validations:
      required: true

  - type: input
    id: kxml-version
    attributes:
      label: kxml version and module
      description: Such as kxml-core 1.0.0.
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK and Kotlin version
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The stack trace or the output. Remove anything sensitive before pasting.
      render: shell
    validations:
      required: false
