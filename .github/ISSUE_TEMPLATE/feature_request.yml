name: Feature request
description: Propose a concrete addition or change to kxml.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current API does not cover it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API you would like to write, as a Kotlin snippet.
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Which input of the proposal may come from an attacker, and how it is bounded and escaped.
    validations:
      required: false
