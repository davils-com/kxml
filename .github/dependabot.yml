version: 2

# Dependabot changes versions only: the dependencies stage of the pipeline regenerates the lock files and the
# verification metadata and commits them to the pull request, see CONTRIBUTING.md.
#
# The Kotlin version is never updated by Dependabot. It governs the language of the sources and the API level
# consumers are compiled against, so raising it is a deliberate change.

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.jvm:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
