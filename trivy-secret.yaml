disable-allow-rules:
  - usr-dirs

rules:
  - id: hardcoded-credential
    description: 'Hardcoded credential in source code'
    severity: HIGH
    regex: '(?i)(api[_-]?key|token|secret|password|passwd)\s*=\s*"[A-Za-z0-9_/+\-]{8,}"'
    keywords:
      - apikey
      - api_key
      - api-key
      - token
      - secret
      - password
      - passwd
